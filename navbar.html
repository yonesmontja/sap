<script>
  function navTo(page) {
    window.top.location.href = SCRIPT_URL + "?page=" + page;
  }

  document.addEventListener("DOMContentLoaded", function() {
    // -------------------------------------------------------------
    // 1. PENERAPAN FILTER MENU SESUAI ROLE USER (RBAC)
    // -------------------------------------------------------------
    let user = JSON.parse(sessionStorage.getItem('eduUser') || '{}');
    let role = (user.role || '').toLowerCase();

    // Fungsi pembantu menyembunyikan elemen <li> pembungkus
    const hideNavItem = (id) => {
      let el = document.getElementById(id);
      if (el) {
        let parentLi = el.closest('.nav-item');
        if (parentLi) parentLi.classList.add('d-none');
      }
    };

    if (role === 'guru') {
      // Sembunyikan menu Master data institusi untuk guru biasa
      // hideNavItem('nav_master');
      hideNavItem('nav_log_aktivitas');

      // Jika BUKAN Wali Kelas, sembunyikan modul evaluasi P5 dan dropdown Cetak Rapor
      if (!user.is_wali_kelas) {
        hideNavItem('nav_catatan_p5');
        hideNavItem('navbarDropdownRapor');
      }
    } else if (role === 'siswa') {
      // Siswa hanya boleh melihat Dashboard/Profil (sembunyikan seluruh menu operasional guru)
      ['nav_master', 'navbarDropdownNilai', 'nav_presensi', 'nav_jurnal', 'nav_catatan_p5', 'navbarDropdownRapor', 'nav_log_aktivitas'].forEach(hideNavItem);
    } else if (role === 'kepsek') {
      // Kepala Sekolah memiliki akses monitoring semua kelas dan pencetakan,
      // opsi: sembunyikan konfigurasi teknis data master institusi jika diperlukan
      //hideNavItem('nav_master');
    }
    // Catatan: Role 'admin' tidak difilter sehingga mendapatkan akses penuh ke semua menu.

    // -------------------------------------------------------------
    // 1b. PENJAGA HALAMAN (cegah akses lewat ketik ?page=... di URL)
    // Aturannya sama dengan filter menu di atas. Catatan: ini lapis
    // kenyamanan di browser; penjaga sebenarnya akan ada di server (token sesi).
    // -------------------------------------------------------------
    const PAGE_ACCESS = {
      siswa: ['dashboard', 'profil'],
      guruBukanWali: { blocked: ['log_aktivitas', 'rapor', 'rapor_p5', 'catatan_p5', 'laporan_stnkm'] },
      guru: { blocked: ['log_aktivitas'] }
    };

    function isPageAllowed(page) {
      if (role === 'siswa') return PAGE_ACCESS.siswa.includes(page);
      if (role === 'guru') {
        let rule = user.is_wali_kelas ? PAGE_ACCESS.guru : PAGE_ACCESS.guruBukanWali;
        return !rule.blocked.includes(page);
      }
      return true; // admin, kepsek & role lain: akses penuh (sama seperti filter menu)
    }

    // -------------------------------------------------------------
    // 2. HIGHLIGHT MENU AKTIF BERDASARKAN URL
    // -------------------------------------------------------------
    google.script.url.getLocation(function(location) {
      let currentPage = 'dashboard';
      if (location && location.parameter && location.parameter.page) {
        currentPage = location.parameter.page;
      }

      if (!user.role) {
        window.top.location.href = SCRIPT_URL + "?page=login";
        return;
      }
      if (!isPageAllowed(currentPage)) {
        // Sembunyikan isi halaman, tetapi biarkan pesan SweetAlert tetap terlihat
        let guardStyle = document.createElement('style');
        guardStyle.textContent = 'body > *:not(.swal2-container) { visibility: hidden !important; }';
        document.head.appendChild(guardStyle);
        // Sandbox Apps Script hanya mengizinkan pindah halaman (window.top) setelah
        // tindakan pengguna (klik). Timer otomatis diblokir browser, jadi wajib klik.
        Swal.fire({
          icon: 'error', title: 'Akses Ditolak',
          text: 'Peran Anda tidak memiliki akses ke halaman ini.',
          confirmButtonText: '<i class="fa-solid fa-house me-1"></i> Kembali ke Dashboard',
          allowOutsideClick: false, allowEscapeKey: false
        }).then(() => { window.top.location.href = SCRIPT_URL + "?page=dashboard"; });
        return;
      }
      if (currentPage === 'profil') currentPage = 'dashboard'; 
      
      document.querySelectorAll('.navbar-custom .nav-link').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.dropdown-item').forEach(el => el.classList.remove('active', 'bg-light'));
      
      let activeNav = document.getElementById('nav_' + currentPage);
      if (activeNav) { 
        activeNav.classList.add('active'); 
        let parentDropdown = activeNav.closest('.dropdown');
        if (parentDropdown) {
          parentDropdown.querySelector('.nav-link.dropdown-toggle').classList.add('active');
          activeNav.classList.add('bg-light');
        }
      }
    });

    // -------------------------------------------------------------
    // 3. RESPONSIVE TABLE CONTAINER
    // -------------------------------------------------------------
    setTimeout(() => {
      document.querySelectorAll('table').forEach(function(tbl) {
        if (!tbl.parentElement.classList.contains('table-responsive')) {
          let wrapper = document.createElement('div');
          wrapper.className = 'table-responsive';
          wrapper.style.width = '100%';
          wrapper.style.overflowX = 'auto';
          wrapper.style.WebkitOverflowScrolling = 'touch'; 
          wrapper.style.border = 'none';
          
          tbl.parentNode.insertBefore(wrapper, tbl);
          wrapper.appendChild(tbl);
        }
      });
    }, 1000); 
  });

  function logout() {
    Swal.fire({
      title: 'Akhiri Sesi?',
      text: "Anda akan keluar dari sistem EduRapor.",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#d33',
      cancelButtonColor: '#6c757d',
      confirmButtonText: '<i class="fa-solid fa-right-from-bracket me-1"></i> Ya, Keluar',
      cancelButtonText: 'Batal',
      reverseButtons: true
    }).then((result) => {
      if (result.isConfirmed) {
         let cUser = JSON.parse(sessionStorage.getItem('eduUser') || '{}');
         let auditUser = cUser.name || cUser.username || "Unknown";
         
         // CATAT LOG AKTIVITAS LOGOUT
         google.script.run
           .withSuccessHandler(() => {
              sessionStorage.removeItem('eduUser');
              sessionStorage.removeItem('eduAppState'); 
              window.top.location.href = SCRIPT_URL + "?page=login";
           })
           .saveLogAktivitasBatch([{
              username: auditUser,
              role: cUser.role || "Unknown",
              modul: 'Autentikasi',
              aktivitas: `Logout (keluar) dari sistem EduRapor.`
           }]);
      }
    });
  }
</script>

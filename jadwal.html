    ======================================================== */
    .fc .fc-toolbar-title {

    .fc .fc-button-primary {

    /* ========================================================

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    let cUser = null;
    try { cUser = JSON.parse(sessionStorage.getItem('eduUser')); if(!cUser) window.top.location.href = SCRIPT_URL + "?page=login"; } catch(e) {}

    let DB = {};
    let calendar;
    let editJadwalId = null; 
    let existingUrlLampiran = ""; 
    const isAdmin = cUser && (cUser.role === 'admin' || cUser.role === 'kepsek');
    
    function initApp() {
      // Hilangkan pemblokiran panelLeft untuk Guru. Semua melihat panel kiri sekarang.
      loadDatabase();
    }

    function loadDatabase() {
      google.script.run
        .withSuccessHandler(res => { 
          DB = res || {}; 
          if (isAdmin) renderManajerialFilters();
          renderColorPicker();
          initCalendar();
          populateModalDropdowns();
          document.getElementById('loadingOverlay').style.display = 'none';
        })
        .withFailureHandler(err => { 
          document.getElementById('loadingOverlay').style.display = 'none';
          Swal.fire('Error', err.message, 'error'); 
        })
        .getRelationalData(); 
    }

    function renderColorPicker() {
      let colors = ['#3f51b5', '#20c997', '#6f42c1', '#fd7e14', '#e83e8c', '#dc3545', '#0dcaf0', '#198754', '#ffc107', '#6c757d', '#000000', '#d63384'];
      let container = document.getElementById('colorPickerContainer');
      let html = '';
      colors.forEach((c, idx) => {
        let sel = idx === 0 ? 'selected' : '';
        html += `<div class="color-option ${sel}" style="background-color: ${c};" onclick="selectColor(this, '${c}')"></div>`;
      });
      html += `<input type="hidden" id="j_warna" value="${colors[0]}">`;
      container.innerHTML = html;
    }

    function selectColor(elem, hexColor) {
      document.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
      elem.classList.add('selected');
      document.getElementById('j_warna').value = hexColor;
    }

    function toggleRepeatOptions() {
      let rType = document.getElementById('j_ulangi').value;
      if(rType === '1') { 
         document.getElementById('customDaysBox').style.display = 'none';
         document.getElementById('batasWaktuBox').style.display = 'none';
      } else if (rType === 'harian') {
         document.getElementById('customDaysBox').style.display = 'none';
         document.getElementById('batasWaktuBox').style.display = 'block';
      } else {
         document.getElementById('customDaysBox').style.display = 'block';
         document.getElementById('batasWaktuBox').style.display = 'block';
      }
    }

    function showL(t="Memproses...") { document.getElementById('loadingText').innerText = t; document.getElementById('loadingOverlay').style.display = 'flex'; }
    function hideL() { document.getElementById('loadingOverlay').style.display = 'none'; }

    function parseSafeDate(dStr) {
      if (!dStr) return null; dStr = String(dStr).trim();
      let testDate = new Date(dStr);
      if (!isNaN(testDate.getTime())) {
         let y = testDate.getFullYear(); let m = String(testDate.getMonth() + 1).padStart(2, '0'); let d = String(testDate.getDate()).padStart(2, '0');
         let h = String(testDate.getHours()).padStart(2, '0'); let min = String(testDate.getMinutes()).padStart(2, '0');
         return `${y}-${m}-${d}T${h}:${min}:00`;
      }
      let dPart = "", tPart = "00:00:00";
      if (dStr.includes('T')) { let parts = dStr.split('T'); dPart = parts[0]; tPart = parts[1] || "00:00:00"; } 
      else { let parts = dStr.split(' '); dPart = parts[0]; if (parts.length > 1) tPart = parts[1]; }
      if (dPart === "" || dPart.startsWith("T")) dPart = new Date().toISOString().split('T')[0];
      let timeParts = tPart.split(':');
      let h = (timeParts[0] || '00').padStart(2, '0'); let min = (timeParts[1] || '00').padStart(2, '0'); let s = (timeParts[2] || '00').padStart(2, '0');
      tPart = `${h}:${min}:${s}`;
      if (dPart.includes('/')) {
        let p = dPart.split('/');
        if (p.length === 3) {
          if (p[0].length === 4) return `${p[0]}-${p[1].padStart(2,'0')}-${p[2].padStart(2,'0')}T${tPart}`;
          return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}T${tPart}`;
        }
      } else if (dPart.includes('-')) {
        let p = dPart.split('-');
        if (p.length === 3) {
           if (p[0].length === 4) return `${p[0]}-${p[1].padStart(2,'0')}-${p[2].padStart(2,'0')}T${tPart}`;
           return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}T${tPart}`;
        }
      }
      return `${dPart}T${tPart}`;
    }

    function initCalendar() {
      let calEl = document.getElementById('calendar');
      calendar = new FullCalendar.Calendar(calEl, {
        // Mode default ke minggu, tapi header punya opsi lengkap ala G-Calendar
        initialView: 'timeGridWeek',
        headerToolbar: { 
          left: 'prev,next today', 
          center: 'title', 
          right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek' 
        },
        buttonText: { month: 'Bulan', week: 'Minggu', day: 'Hari', list: 'Agenda' },
        slotMinTime: '07:00:00', slotMaxTime: '16:00:00', allDaySlot: false, 
        
        // Drag & drop aktif untuk semua, tapi dicegat di dalam handleDropEvent jika bukan pemilik
        editable: true, 
        eventDrop: handleDropEvent, eventResize: handleDropEvent, eventClick: handleEventClick, 
        
        // Fitur Klik Grid Hari (Buka form otomatis terisi tanggal yang diklik)
        dateClick: function(info) {
           bukaModalJadwalBaru(info.dateStr);
        },
        
        events: getFormattedEvents(),
        eventContent: function(arg) {
          let props = arg.event.extendedProps;
          let waktu = arg.timeText || '';
          let statWarna = 'text-warning';
          if(props.status === 'Berlangsung') statWarna = 'text-success';
          if(props.status === 'Selesai') statWarna = 'text-muted';
          if(props.status === 'Batal') statWarna = 'text-danger';

          // Verifikasi kepemilikan untuk tombol edit/hapus
          let isOwner = cUser.role === 'guru' && props.guruId === cUser.username;
          // Di dalam eventContent saat merender tombol kalender:
          let canEdit = arg.event.extendedProps.canEdit;
          let actionBtns = '';
          if (canEdit) {
              actionBtns = `
              <div class="mt-1 d-flex gap-1" style="position:relative; z-index:9;">
                  <span class="badge bg-light text-primary border cursor-pointer action-edit" onclick="triggerAksiLokal(event, 'edit', '${arg.event.id}')" title="Edit"><i class="fa-solid fa-pen"></i></span>
                  <span class="badge bg-light text-danger border cursor-pointer action-delete" onclick="triggerAksiLokal(event, 'hapus', '${arg.event.id}')" title="Hapus"><i class="fa-solid fa-trash"></i></span>
              </div>`;
          }
          let attachmentIcon = props.lampiran ? `<i class="fa-solid fa-paperclip text-white ms-1 opacity-75"></i>` : '';

          // Ganti baris "return { html: ... }" di dalam eventContent pada fungsi initCalendar() menjadi seperti ini:
          return { 
            html: `<div class="custom-event-card position-relative p-2" style="background-color: ${arg.event.backgroundColor}; color: #fff;     overflow:hidden;">
                    <div class="fw-bold mb-1 lh-sm" style="font-size: 13px;">${props.mapel} ${attachmentIcon}</div>
                    <div style="font-size: 11px;" class="mb-1"><i class="fa-solid fa-user-tie me-1"></i>${props.guru}</div>
                    <div style="font-size: 11px;" class="mb-1"><i class="fa-solid fa-door-open me-1"></i>${props.ruangan}</div>
                    <div style="font-size: 10.5px;" class="mb-1 opacity-75"><i class="fa-regular fa-clock me-1"></i>${waktu}</div>
                    <div style="font-size: 10px; font-weight:600;" class="bg-white rounded px-1 d-inline-block ${statWarna} shadow-sm">${props.status}</div>
                    ${actionBtns}
                  </div>` 
          };
        }
      });
      calendar.render();
    }

    window.triggerAksiLokal = function(e, action, id) { e.stopPropagation(); e.preventDefault(); if (action === 'edit') editJadwal(id); else if (action === 'hapus') hapusJadwal(id); };

    function getFormattedEvents() {
      let events = [];
      let jadwalRaw = DB.TransJadwal || [];
      let selectedGurus = [];
      
      if (isAdmin) {
        let checkboxes = document.querySelectorAll('.filter-guru:checked');
        checkboxes.forEach(c => selectedGurus.push(c.value));
      }

      jadwalRaw.forEach(j => {
        // HAPUS atau KOMENTARI baris ini agar guru bisa melihat jadwal guru lain
        // if (!isAdmin && j.id_guru !== (cUser.id_guru || cUser.username)) return;
        
        if (isAdmin && selectedGurus.length > 0 && !selectedGurus.includes(j.id_guru)) return;

        let materi = DB.MasterMateri?.find(m => m.id_materi === j.id_materi);
        let guru = DB.MasterGuru?.find(g => g.id_guru === j.id_guru);
        let kelas = DB.MasterKelas?.find(k => String(k.id_kelas) === String(j.id_kelas));
        
        let title = (materi ? materi.nama_materi : 'Materi') + (guru ? ` (${guru.nama_guru})` : '');
        let colorClass = 'bg-primary';
        if (materi && materi.nama_materi.toLowerCase().includes('komsos')) colorClass = 'bg-komsos';
        if (materi && materi.nama_materi.toLowerCase().includes('inggris')) colorClass = 'bg-binggris';

        // PENGECEKAN KEPEMILIKAN
        let isOwner = (j.id_guru === cUser.username || j.id_guru === cUser.id_guru);
        let canEdit = isAdmin || isOwner;

        events.push({
          id: j.id_jadwal,
          title: title,
          start: j.tanggal_mulai,
          end: j.tanggal_selesai,
          editable: canEdit, // Hanya bisa di-drag oleh pemilik atau admin
          classNames: [colorClass, 'text-white'],
          extendedProps: {
             guru: guru ? guru.nama_guru : '-',
             kelas: kelas ? kelas.nama_kelas : j.id_kelas,
             canEdit: canEdit, // Diteruskan ke eventContent dan sidebar
             persiapan: j.persiapan_khusus || 'Tidak ada catatan khusus.',
             stnkm: materi ? { S: materi.mat_S, T: materi.mat_T, N: materi.mat_N, K: materi.mat_K, M: materi.mat_M } : null
          }
        });
      });
      return events;
    }

    function eksekusiUpdateBerantai(mode, record, tglAcuan, deltaMs = null, revertCallback = null) {
        Swal.fire({title: 'Menyimpan Perubahan...', toast: true, position: 'top-end', showConfirmButton: false});
        google.script.run
            .withSuccessHandler(r => {
               if (r.success) {

                  let modalEl = document.getElementById('modalJadwal'); if(modalEl) bootstrap.Modal.getInstance(modalEl)?.hide();

               } else { Swal.fire('Gagal', r.message, 'error'); if(revertCallback) revertCallback(); }
            })
            .withFailureHandler(err => { Swal.fire('Error', err.message, 'error'); if(revertCallback) revertCallback(); })
            .updateJadwalBerantai(mode, record, tglAcuan, deltaMs);
    }

    function editJadwal(id) {
       let record = (DB.TransJadwal || []).find(j => j.id_jadwal === id);
       if (!record) return;

       editJadwalId = id; 
       document.getElementById('modalJadwalTitle').innerHTML = '<i class="fa-solid fa-pen me-2"></i>Edit Jadwal';
       document.getElementById('j_guru').value = record.id_guru;
       document.getElementById('j_ruangan').value = record.id_ruangan || '';
       document.getElementById('j_mapel').value = record.id_mapel;
       document.getElementById('j_materi').value = record.id_materi;
       document.getElementById('j_status').value = record.status_sesi || 'Menunggu';
       
       let partsData = (record.persiapan_khusus || "").split('|');
       let hex = partsData[0] && partsData[0].startsWith('#') ? partsData[0] : '#3f51b5';
       document.getElementById('j_warna').value = hex;
       document.getElementById('j_persiapan').value = partsData[1] || ''; 
       existingUrlLampiran = partsData[2] || ''; 
       
       document.querySelectorAll('.color-option').forEach(el => {
          if(el.style.backgroundColor === hex || el.style.backgroundColor === hexToRgb(hex)) { el.classList.add('selected'); } 
          else { el.classList.remove('selected'); }
       });
       
       let safeStart = parseSafeDate(record.tanggal_mulai); let safeEnd = parseSafeDate(record.tanggal_selesai);
       if(safeStart) document.getElementById('j_mulai').value = safeStart.slice(0, 16);
       if(safeEnd) document.getElementById('j_selesai').value = safeEnd.split('T')[1].slice(0, 5);

       document.getElementById('areaPeriodisitas').style.display = 'none';
       document.getElementById('btnSimpanJadwal').innerHTML = '<i class="fa-solid fa-save me-2"></i> Perbarui Jadwal';
       tutupPanelKanan();
       new bootstrap.Modal(document.getElementById('modalJadwal')).show();
    }

           Swal.fire({
               title: 'Hapus Jadwal Berulang',

               icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Eksekusi Hapus'
           }).then(res => {

           }).then(res => { if (res.isConfirmed) eksekusiHapusBerantai('only_this', id, null, null); });
       }
    }

    function handleSubmitJadwal(e) {
       e.preventDefault();
       let fileInput = document.getElementById('j_file').files[0];
       
       if (fileInput) {
          showL("Mengunggah Lampiran ke Drive...");
          let reader = new FileReader();
          reader.onload = function(evt) {
             let base64 = evt.target.result.split(',')[1];
             google.script.run
               .withSuccessHandler(function(res) {
                  if(res.success) {
                     existingUrlLampiran = res.url; hideL(); prosesSimpanUtama(); 
                  } else { hideL(); Swal.fire('Error Upload', res.message, 'error'); }
               })
               .uploadFileToDrive(base64, fileInput.name, fileInput.type);
          };
          reader.readAsDataURL(fileInput);
       } else { prosesSimpanUtama(); }
    }

    function prosesSimpanUtama() {
      let btn = document.getElementById('btnSimpanJadwal');
      btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';

      let idMateri = document.getElementById('j_materi').value;
      let materiObj = DB.MasterMateri?.find(m => m.id_materi === idMateri);
      let warna = document.getElementById('j_warna').value;
      let teksPersiapan = document.getElementById('j_persiapan').value;
      let gabunganPersiapan = warna + '|' + teksPersiapan + '|' + existingUrlLampiran;

      let rawMulai = document.getElementById('j_mulai').value; 
      let rawSelesaiTime = document.getElementById('j_selesai').value; 
      let tglDasar = rawMulai.split('T')[0];
      
      let record = {
        id_guru: document.getElementById('j_guru').value,
        id_mapel: document.getElementById('j_mapel').value,
        id_materi: idMateri,
        id_kelas: materiObj ? materiObj.id_kelas : "",
        id_periode: (DB.MasterPeriode?.find(p => p.status_aktif === 'AKTIF')?.id_periode) || '',
        id_ruangan: document.getElementById('j_ruangan').value,
        tanggal_mulai: rawMulai,
        tanggal_selesai: tglDasar + "T" + rawSelesaiTime,
        persiapan_khusus: gabunganPersiapan, 
        status_sesi: document.getElementById('j_status').value
      };

      if (editJadwalId) {
         let oldData = DB.TransJadwal.find(j => j.id_jadwal === editJadwalId);
         record.id_jadwal = editJadwalId; record.id_group = oldData.id_group || "";

         if (record.id_group) {
             Swal.fire({
                 title: 'Simpan Perubahan Jadwal',
                 html: `<div class="text-start mt-3"><div class="form-check mb-2"><input class="form-check-input" type="radio" name="editMode" id="edit1" value="only_this" checked><label class="form-check-label" for="edit1">Hanya jadwal ini (Pengecualian)</label></div><div class="form-check mb-2"><input class="form-check-input" type="radio" name="editMode" id="edit2" value="following"><label class="form-check-label" for="edit2">Jadwal ini dan selanjutnya</label></div><div class="form-check"><input class="form-check-input" type="radio" name="editMode" id="edit3" value="all"><label class="form-check-label fw-bold" for="edit3">Semua jadwal dalam rangkaian ini</label></div></div>`,
                 icon: 'question', showCancelButton: true, confirmButtonText: 'Simpan'
             }).then(res => {
                 if (res.isConfirmed) {
                     let mode = document.querySelector('input[name="editMode"]:checked').value;
                     eksekusiUpdateBerantai(mode, record, oldData.tanggal_mulai);
                 } else { btn.disabled = false; btn.innerHTML = 'Perbarui Jadwal'; }
             });
         } else { eksekusiUpdateBerantai('only_this', record, null); }

      } else {
         let repeatType = document.getElementById('j_ulangi').value;
         let arrRecords = [];
         let startBase = new Date(rawMulai); 

         if (repeatType === '1') {
            record.id_jadwal = "JDW-" + new Date().getTime(); record.id_group = ""; arrRecords.push(record);
         } else {
            let dAkhirStr = document.getElementById('j_batas_akhir').value;
            if(!dAkhirStr) { alert("Pilih Batas Akhir Tanggal!"); btn.disabled = false; btn.innerHTML = 'Simpan Jadwal'; return; }
            
            let endLimit = new Date(dAkhirStr + "T23:59:00");
            let targetDays = [];
            
            if (repeatType === 'harian') { targetDays = [0,1,2,3,4,5,6]; } 
            else if (repeatType === 'kustom') {
                document.querySelectorAll('.day-checkbox:checked').forEach(cb => targetDays.push(parseInt(cb.value)));
                if(targetDays.length === 0) { alert("Pilih minimal 1 hari!"); btn.disabled = false; btn.innerHTML = 'Simpan Jadwal'; return; }
            }

            let newGroupId = "GRP-" + new Date().getTime();
            
            // KUNCI PERBAIKAN: Looping Hari Murni (Tanpa Zona Waktu)
            let currentLoop = new Date(startBase.getFullYear(), startBase.getMonth(), startBase.getDate()); 
            let endTimeObj = new Date(endLimit.getFullYear(), endLimit.getMonth(), endLimit.getDate());
            let i = 0;
            // Definisi Parameter Hari Kerja Sistem (1 = Senin, ..., 6 = Sabtu)
            // Indeks 0 (Minggu) sengaja diabaikan.
            const sistemHariKerja = [1, 2, 3, 4, 5, 6]; 
      
            // Saat melakukan iterasi tanggal dari awal sampai akhir batas pengulangan:
            while(currentLoop <= endTimeObj) {
                let dayOfWeek = currentLoop.getDay(); // 0(Minggu) hingga 6(Sabtu)
                let js_wd = currentLoop.getDay(); // 0 (Minggu) s/d 6 (Sabtu)

                // Jika mode "Harian", filter agar hanya memplot di hari kerja yang diizinkan (skip Minggu)
                if (modePeriodisitas === 'harian' && !sistemHariKerja.includes(js_wd)) {
                    currentLoop.setDate(currentLoop.getDate() + 1);
                    continue;
                }

                if (targetDays.includes(dayOfWeek)) {
                    let cloneRec = { ...record };
                    cloneRec.id_jadwal = "JDW-" + new Date().getTime() + "-" + i;
                    
                    let y = currentLoop.getFullYear();
                    let m = String(currentLoop.getMonth() + 1).padStart(2, '0');
                    let d = String(currentLoop.getDate()).padStart(2, '0');
                    
                    let timeStart = rawMulai.split('T')[1];
                    
                    cloneRec.tanggal_mulai = `${y}-${m}-${d}T${timeStart}`; 
                    cloneRec.tanggal_selesai = `${y}-${m}-${d}T${rawSelesaiTime}`; 
                    cloneRec.id_group = newGroupId;
                    arrRecords.push(cloneRec);
                    i++;
                }
                currentLoop.setDate(currentLoop.getDate() + 1); 
            }
         }

         if(arrRecords.length === 0) { Swal.fire('Info', 'Tidak ada tanggal yang sesuai di dalam rentang waktu tersebut.', 'info'); btn.disabled = false; btn.innerHTML = 'Simpan Jadwal'; return; }

         showL(`Menyimpan ${arrRecords.length} Jadwal...`);
         let successCount = 0;
         arrRecords.forEach((rec) => {
            google.script.run
            .withSuccessHandler(res => {
               successCount++;
               if(successCount === arrRecords.length) {
                  btn.disabled = false; btn.innerHTML = 'Simpan Jadwal'; hideL();
                  bootstrap.Modal.getInstance(document.getElementById('modalJadwal')).hide();
                  Swal.fire({toast:true, position:'top-end', icon:'success', title:`${successCount} Jadwal Tersimpan!`, showConfirmButton:false, timer:2000});
                  google.script.run.withSuccessHandler(newData => { DB = newData; terapkanFilter(); }).getRelationalData();
               }
            })
            .saveMasterData('TransJadwal', rec, 'id_jadwal');
         });
      }
    }

    function handleDropEvent(info) {
       let oldData = (DB.TransJadwal || []).find(j => j.id_jadwal === info.event.id);
       if(oldData) {

           // PROTEKSI KEPEMILIKAN
           if (!isAdmin && oldData.id_guru !== cUser.username) {
               Swal.fire('Ditolak', 'Anda hanya bisa menggeser jadwal Anda sendiri.', 'warning');
               info.revert();
               return;
           }
            
           let start = info.event.start; let end = info.event.end || new Date(start.getTime() + 60*60*1000);
           
           // HITUNG SELISIH WAKTU (DELTA TIME)
           let originalDate = new Date(oldData.tanggal_mulai);
           if(isNaN(originalDate.getTime())) originalDate = new Date(String(oldData.tanggal_mulai).split('T')[0]);
           let deltaMs = start.getTime() - originalDate.getTime();

           let record = { ...oldData };
           record.tanggal_mulai = new Date(start.getTime() - (start.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
           record.tanggal_selesai = new Date(end.getTime() - (end.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);

           if(oldData.id_group) {
              Swal.fire({
                 title: 'Pindahkan Jadwal',
                 html: `<div class="text-start mt-3"><div class="form-check mb-2"><input class="form-check-input" type="radio" name="editMode" id="drop1" value="only_this" checked><label class="form-check-label" for="drop1">Pindahkan HANYA jadwal ini</label></div><div class="form-check mb-2"><input class="form-check-input" type="radio" name="editMode" id="drop2" value="following"><label class="form-check-label" for="drop2">Geser jam dan hari untuk jadwal ini dan selanjutnya secara paralel</label></div><div class="form-check"><input class="form-check-input" type="radio" name="editMode" id="drop3" value="all"><label class="form-check-label fw-bold" for="drop3">Geser jam dan hari untuk SEMUA jadwal di rangkaian ini secara paralel</label></div></div>`,
                 icon: 'info', showCancelButton: true, confirmButtonText: 'Terapkan'
              }).then(res => {
                 if(res.isConfirmed) {
                     let mode = document.querySelector('input[name="editMode"]:checked').value;
                     eksekusiUpdateBerantai(mode, record, oldData.tanggal_mulai, deltaMs, () => info.revert());
                 } else { info.revert(); }
              });
           } else { eksekusiUpdateBerantai('only_this', record, null, null, () => info.revert()); }
       }
    }

    function hexToRgb(hex) {
      let bigint = parseInt(hex.substring(1), 16);
      return `rgb(${(bigint >> 16) & 255}, ${(bigint >> 8) & 255}, ${bigint & 255})`;
    }

    window.onload = initApp;
  </script>

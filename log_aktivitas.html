<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Aktivitas Audit - EduRapor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- SheetJS untuk Export XLSX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body { background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .sortable { cursor: pointer; user-select: none; transition: background-color 0.2s; white-space: nowrap; }
    .sortable:hover { background-color: #e9ecef !important; }
  </style>
</head>
<body>

  <div id="loadingOverlay">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
    <h5 class="mt-3 text-muted fw-bold" id="loadingText">Sinkronisasi Log Audit...</h5>
  </div>

  <script>const SCRIPT_URL = "<?= scriptUrl ?>";</script>
  <?!= include('navbar'); ?>

  <div class="container mt-4 mb-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-2">
      <div>
        <h3 class="fw-bold text-dark m-0">
          <i class="fa-solid fa-user-secret text-danger me-2"></i>Jejak Audit & Log Aktivitas Sistem
        </h3>
        <small class="text-muted">Pemantauan aktivitas operasional pengguna (Guru, Admin, Kepsek) secara transparan.</small>
      </div>
    </div>

    <div class="card shadow-sm p-4 border-0 rounded-4">
      <div class="row mb-3 align-items-center g-2">
        <div class="col-md-5 mb-2">
          <div class="input-group">
            <span class="input-group-text bg-white text-danger border-danger"><i class="fa-solid fa-magnifying-glass"></i></span>
            <input type="text" class="form-control border-danger" id="searchLogInput" placeholder="Cari aktivitas, username, modul..." oninput="handleSearch(this.value)">
          </div>
        </div>
        <div class="col-md-7 mb-2 text-md-end">
          <button class="btn btn-outline-success fw-bold me-2 px-3 rounded-pill" onclick="exportData('xlsx')">
            <i class="fa-solid fa-file-excel me-1"></i> Excel (.xlsx)
          </button>
          <button class="btn btn-outline-secondary fw-bold me-2 px-3 rounded-pill" onclick="exportData('csv')">
            <i class="fa-solid fa-file-csv me-1"></i> CSV
          </button>
          <button class="btn btn-outline-danger fw-bold px-3 rounded-pill" onclick="exportData('pdf')">
            <i class="fa-solid fa-file-pdf me-1"></i> Cetak Laporan PDF
          </button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover table-bordered text-center align-middle" style="font-size: 13px;">
          <thead class="table-dark">
            <tr>
              <th width="15%" class="sortable text-nowrap" onclick="sortTable('timestamp')">Waktu Transaksi <i class="fa-solid fa-sort"></i></th>
              <th width="15%" class="sortable text-nowrap" onclick="sortTable('username')">Pengguna <i class="fa-solid fa-sort"></i></th>
              <th width="10%" class="sortable text-nowrap" onclick="sortTable('role')">Peran <i class="fa-solid fa-sort"></i></th>
              <th width="15%" class="sortable text-nowrap" onclick="sortTable('modul')">Modul <i class="fa-solid fa-sort"></i></th>
              <th width="45%" class="text-start">Deskripsi Aktivitas</th>
            </tr>
          </thead>
          <tbody id="logTableBody"></tbody>
        </table>
      </div>
      
      <div class="d-flex justify-content-between align-items-center mt-3">
        <button class="btn btn-sm btn-outline-danger fw-bold" id="btnPrev" onclick="changePage(-1)"><i class="fa-solid fa-chevron-left me-1"></i> Sebelumnya</button>
        <span id="pageIndicator" class="text-muted fw-bold small">Halaman 1</span>
        <button class="btn btn-sm btn-outline-danger fw-bold" id="btnNext" onclick="changePage(1)">Selanjutnya <i class="fa-solid fa-chevron-right ms-1"></i></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    let cUser = JSON.parse(sessionStorage.getItem('eduUser') || '{}');
    if (!cUser.name || (cUser.role !== 'admin' && cUser.role !== 'kepsek')) {
        Swal.fire('Akses Ditolak', 'Hanya Admin atau Kepsek yang bisa mengakses Log.', 'error').then(() => {
            window.top.location.href = SCRIPT_URL + "?page=dashboard";
        });
    }

    let currentPage = 1;
    const limit = 15;
    let searchQuery = "";
    let sortCol = "timestamp";
    let sortAsc = false;

    // --- TAMBAHKAN BARIS INI ---
    let failsafeTimer = null;

    function showL() { 
      document.getElementById('loadingOverlay').style.display = 'flex'; 
      // Matikan loading otomatis jika server tidak merespons dalam 8 detik
      if(failsafeTimer) clearTimeout(failsafeTimer);
      failsafeTimer = setTimeout(() => { hideL(); }, 8000);
    }
    
    function hideL() { 
      document.getElementById('loadingOverlay').style.display = 'none'; 
      if(failsafeTimer) clearTimeout(failsafeTimer);
    }

    function fetchLogs() {
      showL();
      google.script.run
        .withSuccessHandler(res => {
          renderTable(res);
          hideL();
        })
        .withFailureHandler(err => {
          hideL(); Swal.fire('Error', err.message, 'error');
        })
        .getPaginatedLogAktivitas(currentPage, limit, searchQuery, sortCol, sortAsc);
    }

    document.addEventListener("DOMContentLoaded", fetchLogs);

    function handleSearch(val) {
      searchQuery = val;
      currentPage = 1;
      fetchLogs();
    }

    function sortTable(col) {
      if (sortCol === col) sortAsc = !sortAsc;
      else { sortCol = col; sortAsc = true; }
      fetchLogs();
    }

    function changePage(delta) {
      currentPage += delta;
      fetchLogs();
    }

    function renderTable(res) {
      let tbody = document.getElementById('logTableBody');
      let html = "";
      if (res.data.length === 0) {
        html = `<tr><td colspan="5" class="py-4 text-muted">Tidak ada aktivitas ditemukan.</td></tr>`;
      } else {
        res.data.forEach(r => {
          html += `
            <tr>
              <td><span class="badge bg-light text-dark border">${r.timestamp || '-'}</span></td>
              <td class="fw-bold text-primary">${r.username || '-'}</td>
              <td><span class="badge bg-secondary">${r.role || '-'}</span></td>
              <td><span class="badge bg-danger">${r.modul || '-'}</span></td>
              <td class="text-start text-muted fst-italic">${r.aktivitas || '-'}</td>
            </tr>`;
        });
      }
      tbody.innerHTML = html;
      document.getElementById('pageIndicator').innerText = `Halaman ${res.currentPage} dari ${res.totalPages} (Total: ${res.totalRows})`;
      document.getElementById('btnPrev').disabled = (res.currentPage === 1);
      document.getElementById('btnNext').disabled = (res.currentPage === res.totalPages);
    }

    function exportData(format) {
      showL();
      google.script.run
        .withSuccessHandler(dataFull => {
          hideL();
          if(!dataFull || dataFull.length === 0) return Swal.fire('Kosong', 'Tidak ada data log.', 'info');
          
          if(format === 'xlsx') {
            let ws = XLSX.utils.json_to_sheet(dataFull);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Log_Aktivitas");
            XLSX.writeFile(wb, `Log_Aktivitas_EduRapor_${new Date().getTime()}.xlsx`);
          } 
          else if(format === 'csv') {
            let csvContent = "data:text/csv;charset=utf-8,\uFEFFID Log,Waktu,Pengguna,Peran,Modul,Aktivitas\n";
            dataFull.forEach(r => {
              let act = String(r.aktivitas||'').replace(/"/g, '""').replace(/\n/g, ' ');
              csvContent += `"${r.id_log}","${r.timestamp}","${r.username}","${r.role}","${r.modul}","${act}"\n`;
            });
            let encodedUri = encodeURI(csvContent);
            let link = document.createElement("a"); link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Log_Aktivitas_EduRapor.csv`);
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
          }
          else if(format === 'pdf') {
            let printWin = window.open('', '', 'width=1100,height=850');
            let today = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            let rowsHtml = dataFull.map((r, i) => `<tr><td align="center">${i+1}</td><td align="center">${r.timestamp}</td><td><b>${r.username}</b><br><small>${r.role}</small></td><td align="center">${r.modul}</td><td style="font-style:italic;">${r.aktivitas}</td></tr>`).join('');
            
            let html = `
              <html><head><title>Cetak Log Aktivitas</title>
              <style>
                @page { size: landscape; margin: 15mm; }
                body { font-family: 'Times New Roman', Times, serif; font-size: 11px; }
                table { width: 100%; border-collapse: collapse; margin-top: 15px; }
                th, td { border: 1px solid #000; padding: 6px; }
                th { background-color: #f2f2f2; text-align: center; }
                h2, h4 { text-align: center; margin: 3px 0; }
              </style></head>
              <body>
                <h2>LAPORAN LOG AKTIVITAS (AUDIT TRAIL) SISTEM EDURAPOR</h2>
                <h4>Tanggal Cetak: ${today}</h4>
                <table>
                  <thead><tr><th width="5%">No</th><th width="15%">Waktu</th><th width="15%">Pengguna</th><th width="15%">Modul</th><th width="50%">Deskripsi Aktivitas</th></tr></thead>
                  <tbody>${rowsHtml}</tbody>
                </table>
                <script>window.onload=function(){ window.print(); }<\/script>
              </body></html>
            `;
            printWin.document.open(); printWin.document.write(html); printWin.document.close();
          }
        })
        .getExportLogAktivitas(searchQuery, sortCol, sortAsc);
    }
  </script>
</body>
</html>
